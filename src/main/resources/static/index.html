<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Turístico - Iniciar sesión</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">

<main class="login-card">
    <div class="brand">
        <span class="brand-mark">E</span>
        <div>
            <strong>ERP Turístico</strong>
            <small>Gestión para agencias de viajes</small>
        </div>
    </div>

    <form id="login-form" novalidate>
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" placeholder="admin" required>

        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>

        <button type="submit" id="btn-login">Ingresar</button>
        <p id="mensaje" class="mensaje"></p>
    </form>

    <p class="hint">Demo: <code>admin</code> / <code>admin123</code></p>
</main>

<script src="/js/login.js"></script>
</body>
</html>
