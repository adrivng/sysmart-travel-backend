spring.application.name=erp

# Base de datos (Se leerán de Render)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/erp_travel}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
erp.jwt.secret=${JWT_SECRET:key}
erp.jwt.expiracion-minutos=120

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# PUERTO DINÁMICO PARA RENDER
server.port=${PORT:8080}

gemini.api.key=${GEMINI_API_KEY:clave_de_prueba}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent